<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกสถิติเครื่องจักร - Production Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <div class="bg-slate-800 text-white p-6">
            <h1 class="text-2xl font-bold">🛠️ ระบบบันทึกผลการผลิตเครื่องจักร</h1>
            <p class="text-slate-400 text-sm mt-1">Daily Production & Downtime Report</p>
        </div>

        <form id="recordForm" class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">วันที่บันทึก</label>
                    <input type="date" id="date" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">รหัสเครื่องจักร</label>
                    <select id="machine_id" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 bg-white font-bold text-blue-600">
                        <option value="">-- เลือกเครื่อง --</option>
                        <option value="M01" data-target="40">M01 (เป้า: 40 Shot/Hr)</option>
                        <option value="M02" data-target="50">M02 (เป้า: 50 Shot/Hr)</option>
                        <option value="M03" data-target="60">M03 (เป้า: 60 Shot/Hr)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ทำได้กี่รายการ (พาร์ท)</label>
                    <input type="number" id="total_items" value="1" required class="w-full border rounded-lg p-2.5">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-blue-50 p-4 rounded-lg border border-blue-100">
                <div>
                    <label class="block text-sm font-bold text-blue-900 mb-1">ทั้งหมด (Shot)</label>
                    <input type="number" id="total_shots" placeholder="เช่น 150" required class="w-full border rounded-lg p-2.5 font-semibold text-lg">
                </div>
                <div>
                    <label class="block text-sm font-bold text-blue-900 mb-1">ทั้งหมด (ชิ้น)</label>
                    <input type="number" id="total_pieces" placeholder="เช่น 300" required class="w-full border rounded-lg p-2.5 font-semibold text-lg">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-amber-50 p-4 rounded-lg border border-amber-100">
                <div>
                    <label class="block text-sm font-bold text-amber-900 mb-1">เวลารวมเปิดเครื่อง (นาที)</label>
                    <input type="number" id="total_time" placeholder="เช่น 480" required class="w-full border rounded-lg p-2.5">
                </div>
                <div>
                    <label class="block text-sm font-bold text-amber-900 mb-1">เวลาทำงานจริง (นาที)</label>
                    <input type="number" id="actual_work_time" placeholder="เช่น 450" required class="w-full border rounded-lg p-2.5">
                </div>
            </div>

            <div class="bg-slate-900 text-white p-5 rounded-xl space-y-3">
                <div class="text-xs font-semibold text-slate-400 tracking-wider uppercase">📊 พรีวิวผลลัพธ์ประสิทธิภาพก่อนบันทึก</div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-slate-800 p-3 rounded-lg">
                        <div class="text-xs text-slate-400">ความเร็วจริง</div>
                        <div id="prev_rate" class="text-xl font-bold text-white">0</div>
                        <div class="text-[10px] text-slate-400">Shot/Hr</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg">
                        <div class="text-xs text-slate-400">เทียบกับเป้า</div>
                        <div id="prev_diff" class="text-xl font-bold text-slate-300">0</div>
                        <div class="text-[10px] text-slate-400">Shot</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg">
                        <div class="text-xs text-slate-400">คิดเป็น %</div>
                        <div id="prev_perf" class="text-xl font-bold text-blue-400">0%</div>
                        <div class="text-[10px] text-slate-400">Performance</div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">เบอร์ปัญหา (Issue No.)</label>
                    <input type="text" id="issue_no" placeholder="เช่น No.3 หรือ ไม่มี" class="w-full border rounded-lg p-2.5">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">รายละเอียดปัญหา</label>
                    <input type="text" id="issue_detail" placeholder="เช่น เซ็นเซอร์ขัดข้อง" class="w-full border rounded-lg p-2.5">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">หมายเหตุเพิ่มเติม</label>
                <textarea id="note" rows="2" class="w-full border rounded-lg p-2.5" placeholder="กรอกข้อมูลเพิ่มเติม (ถ้ามี)"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200">
                💾 บันทึกสถัติลง Google Sheets
            </button>
        </form>
    </div>

    <script>
        // กำหนดวันที่วันนี้เป็นค่าเริ่มต้น
        document.getElementById('date').valueAsDate = new Date();

        // ฟังก์ชันคำนวณสดแบบ Live Preview ตามสูตรตรรกะหัวหน้าบิว
        const inputs = ['total_shots', 'actual_work_time', 'machine_id'];
        inputs.forEach(id => document.getElementById(id).addEventListener('input', calculatePreview));

        function calculatePreview() {
            const shots = parseFloat(document.getElementById('total_shots').value) || 0;
            const workMins = parseFloat(document.getElementById('actual_work_time').value) || 0;
            const machineSelect = document.getElementById('machine_id');
            const targetRate = parseFloat(machineSelect.options[machineSelect.selectedIndex]?.dataset.target) || 0;

            if (workMins > 0 && targetRate > 0) {
                const actualRate = (shots * 60) / workMins;
                const diff = actualRate - targetRate;
                const perf = (actualRate / targetRate) * 100;

                document.getElementById('prev_rate').innerText = actualRate.toFixed(1);
                
                const diffEl = document.getElementById('prev_diff');
                diffEl.innerText = (diff > 0 ? "+" : "") + diff.toFixed(1);
                diffEl.className = `text-xl font-bold ${diff >= 0 ? 'text-green-400' : 'text-red-400'}`;

                document.getElementById('prev_perf').innerText = perf.toFixed(0) + "%";
            } else {
                document.getElementById('prev_rate').innerText = "0";
                document.getElementById('prev_diff').innerText = "0";
                document.getElementById('prev_perf').innerText = "0%";
            }
        }

        // ส่งข้อมูลไปบันทึก
        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "⏳ กำลังบันทึกข้อมูล...";

            // =================================================================
            // นำ URL Web App ของ Apps Script มาใส่ในเครื่องหมายคำพูดด้านล่างนี้
            // =================================================================
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz63-pAOx6PTo-64sH4Mqop9PBEdql5ECWICqIe-QYmeA8qfvv8KX5NcPF47yVmICmMRg/exec";

            const payload = {
                date: document.getElementById('date').value,
                machine_id: document.getElementById('machine_id').value,
                total_items: document.getElementById('total_items').value,
                total_shots: document.getElementById('total_shots').value,
                total_pieces: document.getElementById('total_pieces').value,
                total_time: document.getElementById('total_time').value,
                actual_work_time: document.getElementById('actual_work_time').value,
                issue_no: document.getElementById('issue_no').value,
                issue_detail: document.getElementById('issue_detail').value,
                note: document.getElementById('note').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                alert("✅ บันทึกข้อมูลสำเร็จเรียบร้อย!");
                document.getElementById('recordForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                calculatePreview();
            })
            .catch(err => {
                alert("❌ เกิดข้อผิดพลาด ไม่สามารถส่งข้อมูลได้");
                console.error(err);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "💾 บันทึกสถัติลง Google Sheets";
            });
        });
    </script>
</body>
</html>
